[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "hr-process-mining-api"
version = "0.1.0"
description = "Python API for the HR Process Mining and Improvement Platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.2",
  "pandas==2.3.3",
  "pm4py==2.7.23.12",
  "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

